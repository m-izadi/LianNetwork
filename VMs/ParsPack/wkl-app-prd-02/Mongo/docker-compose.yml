# /srv/docker-compose/mongodb/docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: ubuntu/mongodb-7.0:${MONGO_VERSION:-7.0}
    container_name: mongodb-server
    restart: unless-stopped
    
    # استفاده از اوبونتو به جای آلپاین (طبق بند ۸)
    # این image رسمی خودش بر پایه Ubuntu است
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    
    volumes:
      - ${MONGO_DATA_DIR}:/data/db
      - /data/mongodb/config:/data/configdb
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    
    ports:
      - "${MONGO_PORT}:27017"
    
    networks:
      internal:
        ipv4_address: 192.168.77.30
    
    # هیلث‌چک برای اطمینان از آماده‌بودن سرویس
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # برای عیب‌یابی راحت‌تر (اوبونتو)
    stdin_open: true
    tty: true

  # (اختیاری) رابط مدیریتی Mongo-Express
  mongo-express:
    image: mongo-express:1.0
    container_name: mongo-express-ui
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    
    ports:
      - "8081:8081"
    
    networks:
      internal:
        ipv4_address: 192.168.77.31
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    name: mongodb-internal
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.77.0/24
          gateway: 192.168.77.1
